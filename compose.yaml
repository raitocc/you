services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: you
      MYSQL_USER: you
      MYSQL_PASSWORD: you
      MYSQL_ROOT_PASSWORD: you
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: you
      RUSTFS_SECRET_KEY: you
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_NOTIFY_AMQP_ENABLE_PRIMARY: "on"
      RUSTFS_NOTIFY_AMQP_URL_PRIMARY: "amqp://you:you@rabbitmq:5672/%2f"
      RUSTFS_NOTIFY_AMQP_EXCHANGE_PRIMARY: "you.storage.events"
      RUSTFS_NOTIFY_AMQP_ROUTING_KEY_PRIMARY: "media.uploaded"
      RUSTFS_NOTIFY_AMQP_PERSISTENT_PRIMARY: "on"
      RUSTFS_NOTIFY_AMQP_MANDATORY_PRIMARY: "on"
      RUSTFS_NOTIFY_AMQP_QUEUE_DIR_PRIMARY: "/data/notify-amqp-primary"
    command: ["/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: you
      RABBITMQ_DEFAULT_PASS: you
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "you", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  rustfs_data:
  rabbitmq_data:
  redis_data: