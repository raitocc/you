spring:
  application:
    name: you-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:mysql://localhost:3306/you
    username: you
    password: you
  rabbitmq:
    host: localhost
    port: 5672
    username: you
    password: you
  data:
    redis:
      host: localhost
      port: 6379
      password: you

storage:
  endpoint: http://localhost:9000
  # TODO：签名地址建议填写本机局域网 IP，并确保端口可达，方便模拟器和真机共同访问。
  proc-endpoint: http://10.0.2.2:9000
  access-key: you
  secret-key: you
  bucket: you-files
  # 系统默认圈子头像；通过媒体签名能力生成读取地址，不登记为用户文件。
  default-circle-avatar-key: defaults/circle-avatar.png

mybatis-plus:
  type-handlers-package: com.you.youbackend.common.mybatis
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "UTC_TIMESTAMP(3)"

jwt:
  secret: "YouKeepTheMoments_WeKeepTheMagic_2026!"
