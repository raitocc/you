spring:
  application:
    name: you-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:mysql://localhost:3306/you
    username: you
    password: you
  rabbitmq:
    host: localhost
    port: 5672
    username: you
    password: you
  data:
    redis:
      host: localhost
      port: 6379
      password: you

storage:
  endpoint: http://localhost:9000
  access-key: you
  secret-key: you
  bucket: you-files

mybatis-plus:
  type-handlers-package: com.you.youbackend.common.mybatis
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "UTC_TIMESTAMP(3)"

jwt:
  secret: "YouKeepTheMoments_WeKeepTheMagic_2026!"
